<div class="container-fluid px-4">
    <form [formGroup]="customerForm">
        <div class="row g-3">

            <!-- LEFT: Customer Details (col-4) -->
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header">Customer Details</div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label">Name <span class="text-danger">*</span></label>
                            <input type="text" formControlName="name" class="form-control" id="name"
                                placeholder="Full name">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" formControlName="email" class="form-control" id="email"
                                placeholder="name@example.com">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Mobile</label>
                            <input type="text" formControlName="mobile" class="form-control" id="mobile" maxlength="10"
                                placeholder="10 digit mobile number">
                        </div>

                        <div class="d-flex gap-2 mt-4">
                            <button class="btn btn-primary flex-fill" (click)="saveCustomer()">
                                <span id="saveBtnText">Save Customer</span>
                            </button>
                            <button class="btn btn-primary flex-fill" (click)="updateCustomer()">
                                <span id="saveBtnText">Update Customer</span>
                            </button>
                            <button class="btn btn-outline-danger" onclick="deleteCustomer()">Delete</button>
                            <button class="btn btn-outline-secondary" onclick="resetForm()">Clear</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- RIGHT: Address Table (col-8) -->
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span>Addresses</span>
                        <button class="btn btn-sm btn-success" (click)="addCustomerForm()">+ Add Address</button>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-bordered table-sm align-middle" id="addressTable">
                                <thead class="table-light">
                                    <tr>
                                        <th style="width:15%">Title -- {{isFormDone()}}</th>
                                        <th style="width:35%">Address</th>
                                        <th style="width:20%">City</th>
                                        <th style="width:15%">Pincode</th>
                                        <th style="width:8%"></th>
                                    </tr>
                                </thead>
                                <tbody id="addressTableBody" formArrayName="address">
                                    <ng-container *ngFor="let address of customerAddress.controls;let i= index"
                                        [formGroupName]="i">
                                        <tr>
                                            <td>
                                                <input type="text" formControlName="title" class="form-control">
                                            </td>
                                            <td>
                                                <input type="text" formControlName="city" class="form-control">
                                            </td>
                                            <td>
                                                <input type="text" formControlName="pincode" class="form-control">
                                            </td>
                                            <td>
                                                <input type="text" formControlName="address" class="form-control">
                                            </td>
                                            <td>
                                                <button class="btn btn-danger"
                                                    (click)="removeAddress(i)">Remove</button>
                                            </td>
                                        </tr>
                                    </ng-container>

                                </tbody>
                            </table>
                        </div>
                        <div class="text-muted small" id="noAddressMsg">No addresses added yet. Click "Add Address" to
                            add one.</div>
                    </div>
                </div>
            </div>


        </div>
    </form>
    <!-- Customer list -->
    <div class="row mt-4">
        <div class="col-12">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span>All Customers</span>
                    <button class="btn btn-sm btn-outline-secondary" onclick="loadAllCustomers()">Refresh</button>
                </div>
                <div class="card-body p-0">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Cust Id</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Mobile</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="customerListBody">
                            @for (item of customerList(); track $index) {
                            <tr>
                                <td>{{$index+1}}</td>
                                <td>{{item.name}}</td>
                                <td>{{item.email}}</td>
                                <td>{{item.mobile}}</td>
                                <td>
                                    <button class="btn btn-success" (click)="onEdit(item.custId)">Edit</button>
                                </td>
                            </tr>
                            }
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
